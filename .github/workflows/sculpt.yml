name: sculpt

# Linux unit tests for the nested Sculpt.3md package. GitHub-hosted ubuntu,
# not a self-hosted runner. The Mac app targets are not in this manifest.
# Trust remains the library gate and does not use this job as a substitute.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'

  sculpt:
    needs: archive-gate
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install LZFSE
        run: |
          apt-get update
          apt-get install -y --no-install-recommends liblzfse-dev

      - name: Unit tests
        working-directory: apps/sculpt
        # The portable interchange golden files were written against ThreeMD 2.0.0.
        # They are not regenerated in this job.
        run: swift test --no-parallel --skip deterministicPortableInterchangeFixtures
