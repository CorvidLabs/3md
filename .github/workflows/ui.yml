name: UI

# Checkout plus a failure-only artifact upload. upload-artifact@v4 uses the
# Actions runtime token, so the job token stays read-only.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "uitests/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "web/**"
      - "uitests/**"
      - ".github/workflows/ui.yml"

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'

  lab:
    needs: archive-gate
    name: Interactive lab (Chromium + WebKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uitests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run cross-browser lab tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: uitests/playwright-report/
          retention-days: 7
