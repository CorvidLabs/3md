[package]
name = "threemd"
version = "2.2.1"
edition = "2021"
description = "3md parsing, portable binary storage, composition and transactional editing: Markdown with a Z axis."
license = "MIT"
repository = "https://github.com/CorvidLabs/3md"

[dependencies]
unicode-normalization = "=0.1.25"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
