# SpecSync 6.0.0 configuration
# Docs: https://github.com/CorvidLabs/spec-sync

specs_dir = "specs"
source_dirs = ["Sources", "js/src", "rust/src"]
exclude_dirs = []
exclude_patterns = []
required_sections = ["Purpose", "Public API", "Invariants", "Behavioral Examples", "Error Cases", "Dependencies", "Change Log"]
enforcement = "strict"

[lifecycle]
track_history = false

[modules."ThreeMD"]
owns = ["Sources/ThreeMDInterop/", "Tests/ThreeMDTests/", "Examples/", "js/", "rust/", "conformance/", "scripts/", "Package.swift", "fledge.toml", "web/assets/three-md.js", "SPEC.md", "README.md", "AGENTS.md", ".specsync/", "specs/ThreeMD/", ".github/workflows/trust.yml", ".trust.toml", "docs/EDITING-RELEASE.md", "docs/FILE-COMPOSITION.md", "docs/evidence/file-composition/"]

[modules."ThreeMDViewer"]
owns = ["web/viewer.html", "web/gather.ts", "web/github-source.ts", "web/open-document.ts", "web/assets/open-document.js", "web/gather.test.ts", "web/github-source.test.ts", "web/open-document.test.ts", "uitests/viewer.spec.mjs", "specs/ThreeMDViewer/"]
