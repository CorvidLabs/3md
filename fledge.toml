# fledge.toml - project task definitions and lanes
# Detected project type: swift
#
# Trust is the complete repository gate (see AGENTS.md). The `verify` lane is
# its native implementation-verification component.

[tasks]
# swift format unifies formatting and linting. `fmt` fixes in place; `lint`
# is the non-mutating check that the verify lane and CI run.
fmt = "swift-format format --in-place --recursive Sources Tests Package.swift"
lint = "swift-format lint --strict --recursive Sources Tests Package.swift"
build = "swift build"
test = "swift test"
element-bundle = "bun scripts/check-element-bundle.mjs"
interchange = "swift run threemd-interchange"

[tasks.editor]
cmd = "bun install --frozen-lockfile && bun run test"
dir = "editor/vscode"
description = "VS Code grammar tests for 3md syntax highlighting and cross-plane links."

[tasks.ui]
cmd = "bun install --frozen-lockfile && bun run test"
dir = "uitests"
description = "Playwright UI suite for the web viewer, gallery, and custom element."

[tasks.rust]
cmd = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --all-targets && cargo test --doc && cargo build --example interchange"
dir = "rust"
description = "Rust crate: format check, clippy, and tests (runs the shared conformance vectors)."

[tasks.js]
cmd = "bun install --frozen-lockfile && bun run typecheck && bun run build && bun test"
dir = "js"
description = "TypeScript port: typecheck, build distributable JavaScript/declarations and execute shared tests."

[tasks.gdscript]
cmd = "bash gdscript/tools/check.sh"
description = "Godot 4.7 addon: import a .3md and a kind-2 .3mdb, load() both, then the headless text, binary, composition, linked-file, edit, and example checks. Not in the verify lane."

[tasks.gdscript-interchange]
cmd = "THREEMD_GODOT=\"${GODOT:-godot}\" swift run threemd-interchange"
description = "Sixteen-pair interchange with the Godot adapter. Not in the verify lane; hosted CI does not install Godot."

[lanes.verify]
description = "Three language suites, nine-pair public-package interchange, generated bundle drift and editor grammar. Trust runs SpecSync after this lane."
steps = ["lint", "build", "test", "js", "rust", "interchange", "element-bundle", "editor"]

[lanes.ci]
description = "Alias for the native verify lane."
steps = ["lint", "build", "test", "js", "rust", "interchange", "element-bundle", "editor"]

[lanes.ui]
description = "Browser UI suite for the published web surfaces."
steps = ["ui"]

[tasks.sculpt]
cmd = "/usr/bin/swift run --quiet RookTool format && /usr/bin/swift run --quiet RookTool test && /usr/bin/swift run --quiet RookTool intent && /usr/bin/swift run --quiet RookTool spec && /usr/bin/swift run --quiet RookTool boundaries"
dir = "apps/sculpt"
description = "Local macOS Sculpt.3md checks. CI unit tests run on Linux in .github/workflows/sculpt.yml."

[lanes.sculpt]
description = "macOS lane for the nested Sculpt.3md app. lanes.verify stays the cross-platform parser gate."
steps = ["sculpt"]
